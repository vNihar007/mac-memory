[project]
name = "mac-memory"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Varun Nihar", email = "varunnihar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "dotenv>=0.9.9",
    "google-genai>=2.4.0",
    "pillow>=12.2.0",
    "pillow-heif>=0.15.0",
    "pymupdf>=1.27.2.3",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
]

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "exifread>=3.5.1",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "openai-whisper>=20250625",
    "pytesseract>=0.3.13",
    "pytest>=9.0.3",
    "sse-starlette>=2.0",
    "uvicorn>=0.47.0",
]
